<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 3</title>
        <link rel="stylesheet" href = "style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Encrypted Message Manager</h1>
            <p class="subtitle">Send, store, and retrieve encrypted messages securely</p>
        </header>

        <section class="input-section">
            <h2>Create Message</h2>
            <div class="form-group">
                <label for="password">Encryption Password</label>
                <input type="text" id="password" placeholder="Enter password">
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" placeholder="Enter your message here..."></textarea>
            </div>
            <button id="send_button" class="btn btn-primary">Send Message</button>
        </section>

        <section class="action-section">
            <h2>Message Actions</h2>
            <div class="button-group">
                <button id="display_button" class="btn btn-secondary">Display Messages</button>
                <button id="delete_button" class="btn btn-danger">Delete Messages</button>
            </div>
        </section>

        <section class="results-section">
            <h2>Messages</h2>
            <div id="place_to_put_return_data" class="messages-display"></div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
