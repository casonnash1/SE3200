<!doctype html>
<html lang = "en">
    <head>
        <meta charset="UTF-8">
        <title>Project 2</title>
        <link rel="stylesheet" href = "style.css">
        <script src="typecharts.js"></script>
        <script src="scripts.js"></script>
    </head>
    <body>
        <main class="game-layout">
            <section class="battlefield">
                <div class="enemy-team">
                    <div class="pokemon-card enemy-slot active">
                        <img id="enemy_image1" alt="">
                        <p id="enemy_caption1"></p>
                    </div>

                    <div class="pokemon-card enemy-slot">
                        <img id="enemy_image2" alt="">
                        <p id="enemy_caption2"></p>
                    </div>

                    <div class="pokemon-card enemy-slot">
                        <img id="enemy_image3" alt="">
                        <p id="enemy_caption3"></p>
                    </div>
                </div>

                <div class="player-team">
                    <div class="pokemon-card">
                        <img id="team_image1" alt="">
                        <p id="team_caption1"></p>
                    </div>

                    <div class="pokemon-card">
                        <img id="team_image2" alt="">
                        <p id="team_caption2"></p>
                    </div>

                    <div class="pokemon-card">
                        <img id="team_image3" alt="">
                        <p id="team_caption3"></p>
                    </div>
                </div>

                <button id="attack">Attack</button>
            </section>

            <div id="battle-text">
                <p></p>
            </div>
        </main>
    </body>
</html>
